<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#9b3a3a" />
  <title>Japan 2026 — Printable Itinerary</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/favicon.svg" />
  <link rel="stylesheet" href="/itinerary-print.css" />
</head>
<body>
  <header class="screen-toolbar">
    <div><strong>Japan 2026 · Printable Itinerary</strong><span id="page-count">Preparing 10 pages…</span></div>
    <button id="print-button" type="button">Print / Save PDF</button>
  </header>
  <p class="screen-note">For A4 landscape, use 100% scale and disable browser headers and footers.</p>
  <div id="external-warning" class="external-warning" role="status" hidden>Internet is required to open maps and external websites.</div>
  <main id="print-root" aria-live="polite"><div class="loading-card">Loading the itinerary…</div></main>
  <template id="error-template">
    <section class="error-card"><h1>Unable to load the itinerary</h1><p>Reconnect and try again. The page will work offline after one successful online load.</p><button type="button" onclick="location.reload()">Retry</button></section>
  </template>
  <script type="module" src="/itinerary-print.js"></script>
</body>
</html>
